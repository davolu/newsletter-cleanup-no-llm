# Web service. Railway reads this file for the service that should stay up.
# The cron worker is railway.cron.toml — point a second service at that config
# (or copy its start command and cron into the dashboard). The cron process
# must exit. It does no work unless the in-app schedule is enabled.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"

# The published template includes a Redis service named Redis.
# https://docs.railway.com/databases/redis
# The same reference is on the cron service, so both processes share one database.
[variables]
REDIS_URL = "${{Redis.REDIS_URL}}"
